<!DOCTYPE html>
<html lang="vi" style="background:transparent !important;background-color:transparent !important;overflow:hidden;margin:0;padding:0;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Đăng Ký Nhận Báo Giá - Realness CRM</title>
  <script src="/popup-engine.js"></script>
  <style>
    html, body, #root {
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      overflow: hidden !important;
      font-family: 'Be Vietnam Pro', 'Inter', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    .embed-stage {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 8px 4px;
      box-sizing: border-box;
      background: transparent;
    }
    #embedCardMount {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    /* High-specificity compact embedded card rules matching PopupFormVisualCard (isEmbedded=true) */
    #root .embed-stage #embedCardMount .pe-close-btn {
      display: none !important;
    }
    #root .embed-stage #embedCardMount .pe-card {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14), 0 0 0 1px rgba(212, 175, 55, 0.25) !important;
    }
    #root .embed-stage #embedCardMount .pe-header {
      padding: 12px 14px 9px !important;
    }
    #root .embed-stage #embedCardMount .pe-excel-icon-wrap {
      width: 82px !important;
      height: 75px !important;
      margin: 0 auto 2px !important;
    }
    #root .embed-stage #embedCardMount .pe-header-badge {
      font-size: 19px !important;
    }
    #root .embed-stage #embedCardMount .pe-body {
      padding: 13px 16px 16px !important;
    }
    #root .embed-stage #embedCardMount .pe-title {
      font-size: 16.5px !important;
      line-height: 1.28 !important;
    }
    #root .embed-stage #embedCardMount .pe-project-name {
      font-size: 20px !important;
      margin: 2px 0 0 !important;
    }
    #root .embed-stage #embedCardMount .pe-project-name.pe-no-date {
      margin-bottom: 10px !important;
    }
    #root .embed-stage #embedCardMount .pe-date-wrap {
      margin: 7px 0 11px !important;
    }
    #root .embed-stage #embedCardMount .pe-date-pill {
      padding: 3.5px 16px !important;
      font-size: 12.5px !important;
    }
    #root .embed-stage #embedCardMount .pe-input-group {
      margin: 0 0 9px !important;
    }
    #root .embed-stage #embedCardMount .pe-input {
      height: 41px !important;
      font-size: 14px !important;
    }
    #root .embed-stage #embedCardMount .pe-units-grid {
      gap: 7px 9px !important;
      margin: 10px 0 12px !important;
    }
    #root .embed-stage #embedCardMount .pe-unit-card {
      min-block-size: 36px !important;
      padding: 5px 9px !important;
      font-size: 12.8px !important;
    }
    #root .embed-stage #embedCardMount .pe-submit-btn {
      height: 44px !important;
      min-height: 44px !important;
      font-size: 15px !important;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="embed-stage">
      <div id="embedCardMount"></div>
    </div>
  </div>
  <script>
    (function () {
      var Engine = window.RealnessPopupEngine;
      var mountEl = document.getElementById("embedCardMount");
      if (!Engine || !mountEl) return;

      var search = new URLSearchParams(window.location.search);
      var rawTarget = (search.get("url") || search.get("projectUrl") || search.get("project") || search.get("p") || "green-skyline").toLowerCase();

      var cfg = {
        projectId: "green-skyline",
        projectUrl: search.get("url") || search.get("projectUrl") || "https://realness.vn/du-an/green-skyline",
        showDate: true,
        datePrefix: "NGÀY:",
        realtimeDate: true
      };

      if (search.get("badge")) cfg.headerBadgeText = search.get("badge");
      if (search.get("title")) cfg.formTitle = search.get("title");
      if (search.get("submit")) cfg.submitText = search.get("submit");

      if (rawTarget.indexOf("vlasta") !== -1) {
        cfg.projectId = "vlasta-premier";
        cfg.projectUrl = "https://realness.vn/du-an/vlasta-premier";
      } else if (rawTarget.indexOf("the-prive") !== -1 || rawTarget.indexOf("theprive") !== -1) {
        cfg.projectId = "the-prive";
        cfg.projectUrl = "https://realness.vn/du-an/the-prive";
      } else if (rawTarget.indexOf("palm-river") !== -1 || rawTarget.indexOf("palmriver") !== -1) {
        cfg.projectId = "palm-river";
        cfg.projectUrl = "https://realness.vn/du-an/palm-river";
      } else if (rawTarget.indexOf("happy-one") !== -1 || rawTarget.indexOf("happyone") !== -1) {
        cfg.projectId = "happy-one-elite";
        cfg.projectUrl = "https://realness.vn/du-an/happy-one-elite";
      } else if (rawTarget.indexOf("tt-genesis") !== -1 || rawTarget.indexOf("genesis") !== -1) {
        cfg.projectId = "tt-genesis";
        cfg.projectUrl = "https://realness.vn/du-an/tt-genesis";
      } else if (rawTarget.indexOf("global-city") !== -1 || rawTarget.indexOf("globalcity") !== -1) {
        cfg.projectId = "global-city";
        cfg.projectUrl = "https://realness.vn/du-an/the-global-city";
      }

      Engine.renderIntoContainer(mountEl, cfg, function (result) {
        try {
          window.localStorage.setItem("rf_pe_converted_" + cfg.projectId, "1");
          window.sessionStorage.setItem("rf_pe_converted_" + cfg.projectId, "1");
          if (window.parent && window.parent !== window) {
            window.parent.localStorage.setItem("rf_pe_converted_" + cfg.projectId, "1");
            window.parent.sessionStorage.setItem("rf_pe_converted_" + cfg.projectId, "1");
          }
        } catch (e) {}
        if (window.parent && window.parent !== window && result && result.lead) {
          window.parent.postMessage(
            {
              type: "RF_LEAD_SUBMITTED",
              leadId: result.lead.id,
              project: result.lead.project || cfg.projectId,
              lead: result.lead
            },
            "*"
          );
        }
        setTimeout(measureAndNotifyHeight, 30);
      });

      var lastPostedHeight = 0;
      var lastWidth = window.innerWidth;

      function measureAndNotifyHeight() {
        if (!window.parent || window.parent === window) return;
        var rect = mountEl.getBoundingClientRect();
        if (rect.height <= 0) return;
        var exactHeight = Math.ceil(rect.height) + 16;
        if (Math.abs(exactHeight - lastPostedHeight) > 2) {
          lastPostedHeight = exactHeight;
          window.parent.postMessage({ type: "RF_LEAD_FORM_RESIZE", height: exactHeight }, "*");
        }
      }

      measureAndNotifyHeight();
      setTimeout(measureAndNotifyHeight, 120);
      setTimeout(measureAndNotifyHeight, 450);

      if (typeof ResizeObserver !== "undefined") {
        var ro = new ResizeObserver(function () {
          measureAndNotifyHeight();
        });
        ro.observe(mountEl);
      }

      if (typeof MutationObserver !== "undefined") {
        var mo = new MutationObserver(function () {
          setTimeout(measureAndNotifyHeight, 20);
        });
        mo.observe(mountEl, { childList: true, subtree: true });
      }

      window.addEventListener("resize", function () {
        if (window.innerWidth !== lastWidth) {
          lastWidth = window.innerWidth;
          measureAndNotifyHeight();
        }
      });
    })();
  </script>
</body>
</html>
